<!DOCTYPE html>
<html lang="en">
<head>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f172a;color:#f1f5f9;min-height:100vh}
nav{background:#1e293b;border-bottom:1px solid #334155;padding:14px 24px;display:flex;align-items:center;gap:16px}
nav a{color:#94a3b8;text-decoration:none;font-size:14px}nav a:hover{color:#f1f5f9}
nav .brand{color:#38bdf8;font-weight:700;font-size:18px}
.ad-banner{background:#1e293b;border-bottom:1px solid #334155;padding:8px;text-align:center}
#app{max-width:540px;margin:36px auto;padding:0 20px 40px}
h1{font-size:26px;font-weight:700;text-align:center;margin-bottom:6px}
.subtitle{text-align:center;color:#94a3b8;margin-bottom:24px;font-size:14px}
.card{background:#1e293b;border-radius:18px;padding:22px;border:1px solid #334155;margin-bottom:14px}
.tabs{display:flex;gap:4px;background:#0f172a;border-radius:10px;padding:4px;margin-bottom:18px}
.tab{flex:1;border:none;border-radius:7px;padding:8px;font-size:14px;font-weight:600;cursor:pointer;background:none;color:#64748b;transition:all .15s}
.tab.active{background:#38bdf8;color:#0f172a}
.unit-tabs{display:flex;gap:4px;background:#0f172a;border-radius:8px;padding:3px;margin-bottom:18px;width:fit-content}
.unit-tab{border:none;border-radius:6px;padding:6px 16px;font-size:13px;font-weight:600;cursor:pointer;background:none;color:#64748b;transition:all .15s}
.unit-tab.active{background:#334155;color:#f1f5f9}
.field{margin-bottom:12px}
label{display:block;font-size:13px;color:#94a3b8;margin-bottom:5px}
.input-row{display:flex;gap:8px}
.input-row input{flex:1;background:#0f172a;color:#f1f5f9;border:1px solid #334155;border-radius:9px;padding:10px 12px;font-size:16px}
.unit-badge{background:#334155;color:#94a3b8;border-radius:6px;padding:10px 12px;font-size:13px;font-weight:600;white-space:nowrap;display:flex;align-items:center}
.result-box{background:#0f172a;border-radius:14px;padding:22px;text-align:center;margin-bottom:14px}
.bf-pct{font-family:monospace;font-size:72px;font-weight:800;line-height:1}
.bf-cat{font-size:18px;font-weight:700;margin:6px 0 4px}
.bf-sub{font-size:13px;color:#64748b}
.prog-track{height:12px;background:#334155;border-radius:6px;overflow:hidden;margin:14px 0 6px}
.prog-fill{height:100%;border-radius:6px;transition:width .4s,background .4s}
.prog-labels{display:flex;justify-content:space-between;font-size:11px;color:#475569}
.ref-table{width:100%;border-collapse:collapse;font-size:13px}
.ref-table th{padding:8px 12px;background:#0f172a;color:#64748b;font-weight:600;text-align:left}
.ref-table td{padding:8px 12px;border-top:1px solid #0f172a}
.ref-table tr:nth-child(even) td{background:#1a2535}
</style>
</head>
<body>
<nav><span class="brand">⚡ Tabutility</span><a href="https://tabutility.com">← All Tools</a></nav>
<div class="ad-banner"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-7039091592734005" data-ad-slot="auto" data-ad-format="auto" data-full-width-responsive="true"></ins><script>(adsbygoogle=window.adsbygoogle||[]).push({});</script></div>
<div id="app">
  <h1>Body Fat % Calculator</h1>
  <p class="subtitle">US Navy method · Enter your measurements for an instant estimate</p>
  <div class="card">
    <div class="tabs">
      <button class="tab active" onclick="setSex('male')">Male</button>
      <button class="tab" onclick="setSex('female')">Female</button>
    </div>
    <div class="unit-tabs">
      <button class="unit-tab active" onclick="setUnit('cm')">cm</button>
      <button class="unit-tab" onclick="setUnit('in')">inches</button>
    </div>
    <div class="field">
      <label>Height</label>
      <div class="input-row"><input type="number" id="height" placeholder="175" oninput="calc()"/><span class="unit-badge" id="u-height">cm</span></div>
    </div>
    <div class="field">
      <label>Neck circumference</label>
      <div class="input-row"><input type="number" id="neck" placeholder="38" oninput="calc()"/><span class="unit-badge" id="u-neck">cm</span></div>
    </div>
    <div class="field">
      <label>Waist circumference</label>
      <div class="input-row"><input type="number" id="waist" placeholder="80" oninput="calc()"/><span class="unit-badge" id="u-waist">cm</span></div>
    </div>
    <div class="field" id="hip-field" style="display:none">
      <label>Hip circumference</label>
      <div class="input-row"><input type="number" id="hip" placeholder="95" oninput="calc()"/><span class="unit-badge" id="u-hip">cm</span></div>
    </div>
  </div>
  <div id="result-section" style="display:none">
    <div class="result-box">
      <div class="bf-pct" id="bf-pct">—</div>
      <div class="bf-cat" id="bf-cat"></div>
      <div class="bf-sub" id="bf-sub"></div>
      <div class="prog-track"><div class="prog-fill" id="prog-fill"></div></div>
      <div class="prog-labels"><span>Essential</span><span>Athlete</span><span>Fit</span><span>Average</span><span>Obese</span></div>
    </div>
    <div class="card">
      <h2 style="font-size:14px;font-weight:600;margin-bottom:12px">Reference Ranges</h2>
      <div id="ref-wrap"></div>
    </div>
  </div>
</div>
<script>
var sex='male', unit='cm';

var CATS_M=[
  ['Essential','2–5%',2,5,'#3b82f6'],
  ['Athlete','6–13%',6,13,'#22c55e'],
  ['Fit','14–17%',14,17,'#84cc16'],
  ['Average','18–24%',18,24,'#f59e0b'],
  ['Obese','25%+',25,100,'#ef4444']
];
var CATS_F=[
  ['Essential','10–13%',10,13,'#3b82f6'],
  ['Athlete','14–20%',14,20,'#22c55e'],
  ['Fit','21–24%',21,24,'#84cc16'],
  ['Average','25–31%',25,31,'#f59e0b'],
  ['Obese','32%+',32,100,'#ef4444']
];

function setSex(s){ sex=s; document.querySelectorAll('.tab').forEach(function(b,i){b.className='tab'+(i===(s==='male'?0:1)?' active':'');}); document.getElementById('hip-field').style.display=s==='female'?'block':'none'; renderRef(); calc(); }
function setUnit(u){ unit=u; document.querySelectorAll('.unit-tab').forEach(function(b,i){b.className='unit-tab'+(i===(u==='cm'?0:1)?' active':'');}); ['u-height','u-neck','u-waist','u-hip'].forEach(function(id){ document.getElementById(id).textContent=u; }); calc(); }

function toIn(v){ return unit==='cm'?v/2.54:v; }

function calc(){
  var h=parseFloat(document.getElementById('height').value);
  var n=parseFloat(document.getElementById('neck').value);
  var w=parseFloat(document.getElementById('waist').value);
  var hp=parseFloat(document.getElementById('hip').value)||0;
  if(!h||!n||!w||(sex==='female'&&!hp)){ document.getElementById('result-section').style.display='none'; return; }
  h=toIn(h); n=toIn(n); w=toIn(w); hp=toIn(hp);
  var bf;
  if(sex==='male'){
    bf=86.010*Math.log10(w-n)-70.041*Math.log10(h)+36.76;
  } else {
    bf=163.205*Math.log10(w+hp-n)-97.684*Math.log10(h)-78.387;
  }
  bf=Math.max(0,Math.round(bf*10)/10);
  document.getElementById('result-section').style.display='block';
  document.getElementById('bf-pct').textContent=bf+'%';
  var cats=sex==='male'?CATS_M:CATS_F;
  var cat=cats[cats.length-1];
  for(var i=0;i<cats.length;i++){ if(bf<=cats[i][3]&&bf>=cats[i][2]){ cat=cats[i]; break; } if(bf<cats[i][2]){ cat=cats[Math.max(0,i-1)]; break; } }
  document.getElementById('bf-cat').textContent=cat[0];
  document.getElementById('bf-cat').style.color=cat[4];
  document.getElementById('bf-pct').style.color=cat[4];
  var maxBf=sex==='male'?40:50;
  document.getElementById('prog-fill').style.width=Math.min(100,bf/maxBf*100)+'%';
  document.getElementById('prog-fill').style.background=cat[4];
  document.getElementById('bf-sub').textContent='Estimated using the US Navy circumference method';
}

function renderRef(){
  var cats=sex==='male'?CATS_M:CATS_F;
  var wrap=document.getElementById('ref-wrap');
  wrap.innerHTML='<table class="ref-table"><thead><tr><th>Category</th><th>'+(sex==='male'?'Men':'Women')+'</th></tr></thead><tbody>'+
    cats.map(function(c){ return '<tr><td style="color:'+c[4]+';font-weight:600">'+c[0]+'</td><td>'+c[1]+'</td></tr>'; }).join('')+'</tbody></table>';
}

renderRef();
</script>
</body>
</html>
